<svg width="900" height="300" viewBox="0 0 900 300"
xmlns="http://www.w3.org/2000/svg">

<defs>

<!-- Fondo -->

<linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#030303"/>
<stop offset="55%" stop-color="#08060b"/>
<stop offset="100%" stop-color="#12091a"/>
</linearGradient>

<!-- Morado -->

<linearGradient id="purple" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#7c3aed"/>
<stop offset="50%" stop-color="#a855f7"/>
<stop offset="100%" stop-color="#c084fc"/>
</linearGradient>

<!-- Glow -->

<filter id="glow">
<feGaussianBlur stdDeviation="5" result="blur"/>
<feMerge>
<feMergeNode in="blur"/>
<feMergeNode in="SourceGraphic"/>
</feMerge>
</filter>

</defs>


<!-- BACKGROUND -->

<rect
width="900"
height="300"
rx="20"
fill="url(#background)"
/>


<!-- DIAGONAL PURPLE SHAPES -->

<path
d="M650 0 L900 0 L900 300 L730 300 Z"
fill="#a855f7"
opacity="0.07"
/>

<path
d="M760 0 L900 0 L900 170 Z"
fill="#c084fc"
opacity="0.08"
/>

<path
d="M0 235 L230 300 L0 300 Z"
fill="#7c3aed"
opacity="0.12"
/>


<!-- GRID -->

<g opacity="0.07" stroke="#ffffff">

<path d="M0 50 H900"/>
<path d="M0 100 H900"/>
<path d="M0 150 H900"/>
<path d="M0 200 H900"/>
<path d="M0 250 H900"/>

<path d="M100 0 V300"/>
<path d="M200 0 V300"/>
<path d="M300 0 V300"/>
<path d="M400 0 V300"/>
<path d="M500 0 V300"/>
<path d="M600 0 V300"/>
<path d="M700 0 V300"/>
<path d="M800 0 V300"/>

</g>


<!-- BORDER -->

<rect
x="1"
y="1"
width="898"
height="298"
rx="20"
fill="none"
stroke="url(#purple)"
stroke-width="1.5"
opacity="0.8"
